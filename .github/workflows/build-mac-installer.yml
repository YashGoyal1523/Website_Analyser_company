name: Build macOS Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for this installer (e.g. 1.2.0)"
        required: false
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version || '1.0.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble .app bundle and build .dmg (client build, server deps, portable Node, launcher)
        shell: bash
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/package-mac.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: WebsiteAnalyzerSetup-mac
          path: installer-output/WebsiteAnalyzerSetup.dmg

      - name: Attach installer to GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "installer-output/WebsiteAnalyzerSetup.dmg" --title "${{ github.ref_name }}" --generate-notes \
            || gh release upload "${{ github.ref_name }}" "installer-output/WebsiteAnalyzerSetup.dmg" --clobber
